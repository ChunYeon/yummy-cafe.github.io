<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>お客様情報 | Yummy Café</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<style>

/* =====================================================
   BASIC
===================================================== */

* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    padding-top: 0;

    font-family:
        "Segoe UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    background: #fdf6f0;

    color: #3b2a21;
}


/* =====================================================
   HERO
===================================================== */

.info-hero {

    min-height: 350px;

    background:

        linear-gradient(
            rgba(61, 40, 28, 0.68),
            rgba(61, 40, 28, 0.68)
        ),

        url("images/reservation.jpg")
        center center / cover no-repeat;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #ffffff;
}


.info-hero-content {

    padding: 40px 20px;
}


.info-hero h1 {

    margin: 0 0 15px;

    font-size: 50px;

    font-weight: 700;

    letter-spacing: 4px;
}


.info-hero p {

    margin: 0;

    font-size: 15px;

    line-height: 2;

    opacity: 0.95;
}


/* =====================================================
   MAIN
===================================================== */

.info-section {

    padding: 70px 20px 90px;

    background: #fdf6f0;
}


.info-wrapper {

    width: 100%;

    max-width: 850px;

    margin: 0 auto;
}


/* =====================================================
   CARD
===================================================== */

.info-card {

    background: #ffffff;

    padding: 45px 45px 50px;

    box-shadow:
        0 15px 45px
        rgba(74, 48, 35, 0.10);

    border-radius: 4px;
}


.info-card h2 {

    margin: 0 0 10px;

    color: #4a3023;

    font-size: 30px;

    font-weight: 700;
}


.info-subtitle {

    margin-bottom: 30px;

    color: #806b5e;

    font-size: 14px;

    line-height: 1.8;
}


/* =====================================================
   RESERVATION SUMMARY
===================================================== */

.reservation-summary {

    margin-bottom: 35px;

    padding: 20px;

    background: #f8f1e9;

    border-left: 3px solid #d9a441;
}


.reservation-summary-title {

    margin-bottom: 14px;

    color: #4a3023;

    font-size: 16px;

    font-weight: 700;
}


.summary-row {

    display: flex;

    justify-content: space-between;

    padding: 7px 0;

    color: #725d50;

    font-size: 14px;

    border-bottom: 1px solid #eadfd7;
}


.summary-row:last-child {

    border-bottom: none;
}


.summary-label {

    font-weight: 600;

    color: #4a3023;
}


/* =====================================================
   FORM
===================================================== */

.form-group {

    margin-bottom: 23px;
}


.form-label {

    display: block;

    margin-bottom: 8px;

    color: #4a3023;

    font-size: 14px;

    font-weight: 600;
}


.form-control {

    width: 100%;

    height: 50px;

    padding: 10px 14px;

    border: 1px solid #dfd2c8;

    border-radius: 2px;

    background: #fffdfa;

    color: #3b2a21;

    font-size: 14px;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}


.form-control:focus {

    border-color: #d9a441;

    outline: none;

    box-shadow:
        0 0 0 0.15rem
        rgba(217, 164, 65, 0.15);
}


/* =====================================================
   BUTTONS
===================================================== */

.button-area {

    margin-top: 30px;
}


.next-button {

    width: 100%;

    height: 54px;

    border: none;

    border-radius: 2px;

    background: #d9a441;

    color: #3b2a21;

    font-size: 15px;

    font-weight: 700;

    letter-spacing: 1px;

    transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}


.next-button:hover {

    background: #c28e2e;

    color: #ffffff;

    transform: translateY(-2px);

    box-shadow:
        0 7px 18px
        rgba(74, 48, 35, 0.15);
}


.back-button {

    width: 100%;

    height: 50px;

    margin-top: 12px;

    border: 1px solid #cdbdb1;

    border-radius: 2px;

    background: #ffffff;

    color: #5d4739;

    font-size: 14px;

    font-weight: 600;

    transition:
        background 0.25s ease,
        border-color 0.25s ease;
}


.back-button:hover {

    background: #f5eee8;

    border-color: #a9907e;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    padding: 35px 15px;
    text-align: center;
    background: rgba(25,20,18,0.45);
    color: #fff;
    backdrop-filter: blur(3px);
}

.footer .brand {
    font-size: 20px;
    margin-bottom: 8px;
}

.footer p {
    margin: 0;
    color: rgba(255,255,255,0.80);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 767px) {

    .info-hero {

        min-height: 300px;

    }


    .info-hero h1 {

        font-size: 38px;

        letter-spacing: 3px;

    }


    .info-section {

        padding: 50px 15px 65px;

    }


    .info-card {

        padding: 35px 25px 40px;

    }


    .info-card h2 {

        font-size: 26px;

    }


    .summary-row {

        flex-direction: column;

        gap: 3px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<div id="navbar-container"></div>



<!-- =====================================================
     HERO
===================================================== -->

<section class="info-hero">

    <div class="info-hero-content">

        <h1>
            お客様情報
        </h1>

        <p>
            ご予約に必要な情報をご入力ください。
        </p>

    </div>

</section>



<!-- =====================================================
     MAIN
===================================================== -->

<section class="info-section">

    <div class="info-wrapper">


        <div class="info-card">

            <h2>
                お客様情報を入力
            </h2>

            <div class="info-subtitle">

                ご予約内容をご確認のうえ、
                お客様の情報をご入力ください。

            </div>



            <!-- =================================================
                 RESERVATION SUMMARY
            ================================================== -->

            <div class="reservation-summary">

                <div class="reservation-summary-title">
                    ご予約内容
                </div>


                <div class="summary-row">

                    <span class="summary-label">
                        日付
                    </span>

                    <span id="summaryDate">
                        -
                    </span>

                </div>


                <div class="summary-row">

                    <span class="summary-label">
                        時間
                    </span>

                    <span id="summaryTime">
                        -
                    </span>

                </div>


                <div class="summary-row">

                    <span class="summary-label">
                        人数
                    </span>

                    <span>
                        <span id="summaryPeople">
                            -
                        </span>
                        名様
                    </span>

                </div>

            </div>



            <!-- =================================================
                 NAME
            ================================================== -->

            <div class="form-group">

                <label
                    for="name"
                    class="form-label"
                >
                    お名前
                </label>

                <input
                    id="name"
                    type="text"
                    class="form-control"
                    placeholder="お名前を入力してください"
                    maxlength="100"
                    required
                >

            </div>



            <!-- =================================================
                 PHONE
            ================================================== -->

            <div class="form-group">

                <label
                    for="phone"
                    class="form-label"
                >
                    電話番号
                </label>

                <input
                    id="phone"
                    type="tel"
                    class="form-control"
                    placeholder="電話番号を入力してください"
                    maxlength="30"
                    required
                >

            </div>



            <!-- =================================================
                 EMAIL
            ================================================== -->

            <div class="form-group">

                <label
                    for="email"
                    class="form-label"
                >
                    メールアドレス
                </label>

                <input
                    id="email"
                    type="email"
                    class="form-control"
                    placeholder="メールアドレスを入力してください"
                    maxlength="150"
                    required
                >

            </div>



            <!-- =================================================
                 BUTTON
            ================================================== -->

            <div class="button-area">

                <button
                    type="button"
                    class="next-button"
                    onclick="goToConfirm()"
                >
                    予約内容を確認する
                </button>


                <!-- 返回 reservation.html -->

                <button
                    type="button"
                    class="back-button"
                    onclick="goBackToReservation()"
                >
                    予約内容に戻る
                </button>

            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="brand">
        Yummy Café
    </div>

    <p>
        Coffee • Cakes • Pasta • Good Moments
    </p>

    <p class="mt-2">
        © 2026 Yummy Café
    </p>

</footer>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


// =====================================================
// LOAD RESERVATION DATA
// =====================================================

const reservationDate =
    sessionStorage.getItem(
        "reservationDate"
    );


const reservationTime =
    sessionStorage.getItem(
        "reservationTime"
    );


const reservationPeople =
    sessionStorage.getItem(
        "reservationPeople"
    );


// =====================================================
// CHECK RESERVATION DATA
// =====================================================

if (
    !reservationDate ||
    !reservationTime ||
    !reservationPeople
) {

    alert(
        "予約情報が見つかりません。"
    );

    window.location.href =
        "reservation.html";

}


// =====================================================
// DISPLAY RESERVATION DATA
// =====================================================

document.getElementById(
    "summaryDate"
).textContent =
    reservationDate;


document.getElementById(
    "summaryTime"
).textContent =
    reservationTime;


document.getElementById(
    "summaryPeople"
).textContent =
    reservationPeople;


// =====================================================
// LOAD PREVIOUS CUSTOMER DATA
// =====================================================

const savedName =
    sessionStorage.getItem(
        "reservationName"
    );


const savedPhone =
    sessionStorage.getItem(
        "reservationPhone"
    );


const savedEmail =
    sessionStorage.getItem(
        "reservationEmail"
    );


if (savedName) {

    document.getElementById(
        "name"
    ).value =
        savedName;

}


if (savedPhone) {

    document.getElementById(
        "phone"
    ).value =
        savedPhone;

}


if (savedEmail) {

    document.getElementById(
        "email"
    ).value =
        savedEmail;

}


// =====================================================
// GO TO CONFIRM
// =====================================================

function goToConfirm() {


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    // -------------------------------------------------
    // CHECK
    // -------------------------------------------------

    if (
        !name ||
        !phone ||
        !email
    ) {

        alert(
            "お名前、電話番号、メールアドレスをすべて入力してください。"
        );

        return;

    }


    // -------------------------------------------------
    // SAVE
    // -------------------------------------------------

    sessionStorage.setItem(
        "reservationName",
        name
    );


    sessionStorage.setItem(
        "reservationPhone",
        phone
    );


    sessionStorage.setItem(
        "reservationEmail",
        email
    );


    // -------------------------------------------------
    // NEXT
    // -------------------------------------------------

    window.location.href =
        "reservation-confirm.html";

}


// =====================================================
// BACK TO RESERVATION
// =====================================================

function goBackToReservation() {

    window.location.href =
        "reservation.html";

}


// =====================================================
// NAVBAR
// =====================================================

fetch("navbar.html")

    .then(
        response =>
            response.text()
    )

    .then(
        data => {

            document.getElementById(
                "navbar-container"
            ).innerHTML =
                data;


            const currentPage =
                window.location.pathname
                    .split("/")
                    .pop() ||
                "index.html";


            const navItems =
                document.querySelectorAll(
                    "#navbar a[data-page]"
                );


            navItems.forEach(
                item => {

                    const page =
                        item.getAttribute(
                            "data-page"
                        );


                    if (
                        page === currentPage
                    ) {

                        item.classList.add(
                            "active-page"
                        );

                    }

                }
            );


            const navbar =
                document.getElementById(
                    "navbar"
                );


            if (navbar) {

                function updateNavbar() {

                    if (
                        window.scrollY > 50
                    ) {

                        navbar.classList.add(
                            "scrolled"
                        );

                    } else {

                        navbar.classList.remove(
                            "scrolled"
                        );

                    }

                }


                window.addEventListener(
                    "scroll",
                    updateNavbar
                );


                updateNavbar();

            }

        }
    )

    .catch(
        error => {

            console.error(
                "ナビゲーションの読み込みに失敗しました:",
                error
            );

        }
    );

</script>


</body>

</html>
