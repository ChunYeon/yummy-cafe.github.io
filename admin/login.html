
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタッフログイン | Yummy Café</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #fdf6f0;
            color: #4b3425;
            font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 42px 36px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(75, 52, 37, .12);
        }

        .brand {
            color: #6f4e37;
            font-size: 30px;
            font-weight: 700;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #88776b;
            text-align: center;
        }

        .form-label { font-weight: 600; }

        .form-control {
            min-height: 48px;
            border-color: #e5d6ca;
            border-radius: 8px;
        }

        .login-button {
            width: 100%;
            min-height: 48px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #6f4e37;
            color: white;
            font-weight: 700;
        }

        .login-button:hover {
            background: #563a29;
            color: white;
        }

        .footer {
            margin-top: 28px;
            color: #999;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1 class="brand">Yummy Café</h1>
        <p class="subtitle">スタッフ管理画面</p>
        <h2 class="h5 mb-4 text-center">ログイン</h2>

        <form id="login-form">
            <div class="mb-3">
                <label for="username" class="form-label">スタッフアカウント</label>
                <input
                    id="username"
                    class="form-control"
                    type="text"
                    autocomplete="username"
                    maxlength="50"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input
                    id="password"
                    class="form-control"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button id="login-button" class="login-button" type="submit">
                ログイン
            </button>

            <div
                id="message"
                class="alert alert-danger mt-3"
                role="alert"
                aria-live="polite"
                hidden
            ></div>
        </form>

        <p class="footer">© 2026 Yummy Café</p>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const button = document.getElementById("login-button");
        const message = document.getElementById("message");

        // ログイン済みなら管理画面へ
        fetch("/api/admin/me")
            .then(response => {
                if (response.ok) {
                    window.location.replace("/admin/reservations.html");
                }
            })
            .catch(() => {});

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.hidden = true;
            button.disabled = true;
            button.textContent = "認証中...";

            try {
                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: document.getElementById("username").value,
                        password: document.getElementById("password").value
                    })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "ログインに失敗しました。"
                    );
                }

                window.location.replace(
                    result.redirect || "/admin/reservations.html"
                );
            } catch (error) {
                message.textContent =
                    error.message || "サーバーに接続できませんでした。";
                message.hidden = false;
            } finally {
                button.disabled = false;
                button.textContent = "ログイン";
            }
        });
    </script>
</body>
</html>
