<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>管理画面 | Yummy Café</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<style>

body {

    background: #fdf6f0;

    font-family:
        "Segoe UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

    color: #4b3425;

}


/* =====================================================
   HEADER
===================================================== */

.header {

    background: #6f4e37;

    color: white;

    padding: 25px 0;

    box-shadow:
        0 3px 10px
        rgba(0, 0, 0, .12);

}


.header h1 {

    margin: 0;

    font-weight: 700;

}


.header p {

    margin: 5px 0 0;

    opacity: .85;

}


/* =====================================================
   MAIN
===================================================== */

.container-main {

    max-width: 1000px;

}


/* =====================================================
   CARDS
===================================================== */

.admin-card {

    background: white;

    border: none;

    border-radius: 14px;

    padding: 30px;

    height: 100%;

    box-shadow:
        0 4px 15px
        rgba(0, 0, 0, .08);

    transition:
        transform .2s,
        box-shadow .2s;

}


.admin-card:hover {

    transform: translateY(-4px);

    box-shadow:
        0 8px 22px
        rgba(0, 0, 0, .12);

}


.admin-icon {

    font-size: 42px;

    margin-bottom: 15px;

}


.admin-card h4 {

    color: #6f4e37;

    font-weight: 700;

}


.admin-card p {

    color: #777;

}


/* =====================================================
   BUTTON
===================================================== */

.admin-button {

    background: #6f4e37;

    color: white;

    border: none;

    padding: 10px 24px;

    border-radius: 8px;

    text-decoration: none;

    display: inline-block;

}


.admin-button:hover {

    background: #563a29;

    color: white;

}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align: center;

    color: #999;

    margin-top: 50px;

    padding-bottom: 30px;

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="container container-main">

        <h1>
            Yummy Café
        </h1>

        <p>
            スタッフ管理画面
        </p>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container container-main mt-5">


    <div class="row g-4">


        <!-- =================================================
             FOOD MANAGEMENT
        ================================================== -->

        <div class="col-md-6">

            <div class="admin-card">

                <div class="admin-icon">
                    🍰
                </div>

                <h4>
                    メニュー管理
                </h4>

                <p>
                    カフェのメニュー、価格、商品画像などを管理できます。
                </p>

                <a
                    href="foods.html"
                    class="admin-button"
                >
                    メニュー管理
                </a>

            </div>

        </div>


        <!-- =================================================
             RESERVATION MANAGEMENT
        ================================================== -->

        <div class="col-md-6">

            <div class="admin-card">

                <div class="admin-icon">
                    📅
                </div>

                <h4>
                    予約管理
                </h4>

                <p>
                    お客様からの予約情報を確認・削除できます。
                </p>

                <a
                    href="reservations.html"
                    class="admin-button"
                >
                    予約管理
                </a>

            </div>

        </div>


    </div>


</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    Yummy Café Admin

    <br>

    © 2026 Yummy Café

</footer>


</body>

</html>
