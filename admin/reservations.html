<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>予約管理 | Yummy Café</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<style>

body {
    background: #fdf6f0;
    font-family:
        "Segoe UI",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    color: #4b3425;
}

.container {
    max-width: 1200px;
}

h2 {
    color: #6f4e37;
    font-weight: 700;
}

.table-box {
    background: #ffffff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.table {
    margin-bottom: 0;
    vertical-align: middle;
}

.table thead th {
    background: #6f4e37 !important;
    color: #ffffff !important;
    text-align: center;
    white-space: nowrap;
}

.table tbody td {
    text-align: center;
    vertical-align: middle;
}

.delete-btn {
    white-space: nowrap;
}

.message {
    text-align: center;
    padding: 30px !important;
    color: #777;
}

</style>

</head>


<body>


<div class="container mt-4 mb-5">

    <h2 class="mb-4">
        予約管理
    </h2>


    <div class="table-box">

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>お名前</th>

                        <th>電話番号</th>

                        <th>メールアドレス</th>

                        <th>日付</th>

                        <th>時間</th>

                        <th>人数</th>

                        <th>操作</th>

                    </tr>

                </thead>


                <tbody id="reservation-list">

                    <tr>

                        <td
                            colspan="8"
                            class="message"
                        >
                            読み込み中...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>


// =====================================================
// LOAD RESERVATIONS
// =====================================================

async function loadReservations() {

    const list =
        document.getElementById(
            "reservation-list"
        );


    try {

        console.log(
            "予約データを取得しています..."
        );


        const response =
            await fetch(
                "/api/reservations"
            );


        console.log(
            "API status:",
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "API error: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "API result:",
            result
        );


        // =================================================
        // IMPORTANT
        // =================================================
        //
        // server.js 返回：
        //
        // {
        //     success: true,
        //     reservations: [...]
        // }
        //
        // 所以必须读取：
        //
        // result.reservations
        // =================================================

        const reservations =
            result.reservations;


        if (
            !Array.isArray(
                reservations
            )
        ) {

            throw new Error(
                "reservations は配列ではありません。"
            );

        }


        // =================================================
        // NO DATA
        // =================================================

        if (
            reservations.length === 0
        ) {

            list.innerHTML = `

                <tr>

                    <td
                        colspan="8"
                        class="message"
                    >
                        現在、予約はありません。
                    </td>

                </tr>

            `;

            return;

        }


        // =================================================
        // DISPLAY
        // =================================================

        list.innerHTML =
            reservations.map(
                r => `

                <tr>

                    <td>
                        ${r.id}
                    </td>

                    <td>
                        ${r.name || ""}
                    </td>

                    <td>
                        ${r.phone || ""}
                    </td>

                    <td>
                        ${r.email || ""}
                    </td>

                    <td>
                        ${r.date || ""}
                    </td>

                    <td>
                        ${r.time || ""}
                    </td>

                    <td>
                        ${r.people || ""}
                    </td>

                    <td>

                        <button
                            type="button"
                            class="btn btn-danger btn-sm delete-btn"
                            onclick="deleteReservation(${r.id})"
                        >
                            削除
                        </button>

                    </td>

                </tr>

            `
            ).join("");


    } catch (error) {

        console.error(
            "予約読み込みエラー:",
            error
        );


        list.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="message text-danger"
                >

                    予約情報を読み込めませんでした。

                    <br>

                    <small>
                        F12 → Console を確認してください。
                    </small>

                </td>

            </tr>

        `;

    }

}


// =====================================================
// DELETE
// =====================================================

async function deleteReservation(id) {


    if (
        !confirm(
            "この予約を削除しますか？"
        )
    ) {

        return;

    }


    try {


        const response =
            await fetch(
                "/api/reservations/" + id,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "削除に失敗しました。"
            );

        }


        alert(
            "予約を削除しました。"
        );


        // 重新读取数据库

        loadReservations();


    } catch (error) {

        console.error(
            "削除エラー:",
            error
        );


        alert(
            error.message ||
            "予約の削除に失敗しました。"
        );

    }

}


// =====================================================
// START
// =====================================================

loadReservations();


</script>


</body>

</html>
